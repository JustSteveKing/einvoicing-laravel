name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: [12, 13]
        include:
          # Testbench tracks the framework two majors behind its own number.
          - laravel: 12
            testbench: 10
          - laravel: 13
            testbench: 11

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Two commands, because --dev is a flag for the whole require, not for
      # one package in it. Together they would put the framework in
      # require-dev on every leg.
      - name: Pin the framework for this leg
        run: >
          composer require --no-interaction --no-update
          "illuminate/contracts:^${{ matrix.laravel }}.0"

      - name: Pin testbench to match
        run: >
          composer require --no-interaction --no-update --dev
          "orchestra/testbench:^${{ matrix.testbench }}.0"

      - uses: ramsey/composer-install@v4
        with:
          # The matrix just rewrote composer.json, so resolve rather than
          # install from a lock file that no longer describes it.
          dependency-versions: highest

      - run: vendor/bin/pest

  quality:
    name: Static analysis and style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: composer.json is publishable
        run: composer validate --strict

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - run: vendor/bin/pint --test
